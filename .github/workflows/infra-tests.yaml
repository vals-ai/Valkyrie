name: Infrastructure checks

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/tracker/Dockerfile.lambda"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/infra-tests.yaml"
  push:
    branches: [dev]
    paths:
      - "infra/**"
      - "services/tracker/Dockerfile.lambda"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/infra-tests.yaml"

permissions:
  contents: read

jobs:
  infra-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run basedpyright

      - name: Run CDK assertion tests
        env:
          JSII_SILENCE_WARNING_DEPRECATED_NODE_VERSION: "1"
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Enable ARM64 container builds
        uses: docker/setup-qemu-action@v3

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the cleanup Lambda image
        working-directory: services/tracker
        run: >-
          docker buildx build
          --platform linux/arm64
          --file Dockerfile.lambda
          --load
          --tag valkyrie-daytona-cleanup:test
          .
