name: Perform a code review when a pull request is created.
on:
  pull_request:
    types: [opened]

jobs:
  codex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs['final-message'] }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Explicitly check out the PR's merge commit.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch base and head refs for the PR
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      # Run codex
      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            This is PR #${{ github.event.pull_request.number }} for ${{ github.repository }}.
            Base SHA: ${{ github.event.pull_request.base.sha }}
            Head SHA: ${{ github.event.pull_request.head.sha }}

            Review ONLY the changes introduced by the PR.
            Suggest any improvements, potential bugs, or issues.
            Be concise and specific in your feedback.

            ## Documentation References
            Check whether the changes require updates to any documentation.
            Look for references to renamed, moved, or deleted files, functions, CLI
            commands, or configuration keys in:
            - README.md
            - docs/ directory (DEVELOPMENT.md, CONTRACTS.md, PROVIDER.md, LAMBDA_USAGE.md, etc.)
            - Inline docstrings or help text
            - services/tracker/README.md and services/tracker/src/tracker/database/README.md
            If any documentation references are now stale or missing, flag them explicitly.

            ## Deprecation Needs
            Check whether any changes introduce deprecations or should be marked as
            deprecated:
            - Are any public functions, CLI commands, config keys, or API endpoints
              being removed or replaced without a deprecation notice?
            - Are there existing deprecation warnings that should now be removed
              because the deprecated feature has been fully deleted?
            - If a breaking change is introduced, flag that it needs a deprecation
              path or migration guide.

            Pull request title and body:
            ----
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

  # post the feedback as a single comment on the PR
  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs['final_message'] != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report Codex feedback
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs['final_message'] }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
