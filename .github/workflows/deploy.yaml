name: Deploy to AWS

on:
  push:
    branches: [dev, prod]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: valkyrie-${{ github.ref_name }}-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Resolve deploy stage
        id: deploy-stage
        run: |
          case "${GITHUB_REF_NAME}" in
            dev|prod)
              echo "stage=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported deploy ref '${GITHUB_REF_NAME}'. Run this workflow from dev or prod."
              exit 1
              ;;
          esac

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::613431292675:role/github-actions-valkyrie-deploy
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install infra dependencies
        run: |
          cd infra
          uv sync

      - name: Deploy all stacks with Slack notifications
        if: steps.deploy-stage.outputs.stage == 'prod'
        env:
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
          VALKYRIE_ALERTS_SLACK_CHANNEL_ID: ${{ secrets.VALKYRIE_ALERTS_SLACK_CHANNEL_ID }}
          DEPLOYMENT_NOTIFICATIONS_SLACK_CHANNEL_ID: ${{ secrets.DEPLOYMENT_NOTIFICATIONS_SLACK_CHANNEL_ID }}
          AUTH_REQUIRED: ${{ secrets.AUTH_REQUIRED }}
          BENCHMARK_CATALOG_URL: ${{ secrets.BENCHMARK_CATALOG_URL }}
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
        run: |
          cd infra
          uv run cdk deploy --all -c stage=${{ steps.deploy-stage.outputs.stage }} --require-approval never

      - name: Deploy all stacks without Slack notifications
        if: steps.deploy-stage.outputs.stage != 'prod'
        env:
          AUTH_REQUIRED: ${{ secrets.AUTH_REQUIRED }}
          BENCHMARK_CATALOG_URL: ${{ secrets.BENCHMARK_CATALOG_URL }}
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
        run: |
          cd infra
          uv run cdk deploy --all -c stage=${{ steps.deploy-stage.outputs.stage }} --require-approval never
