name: Deploy to AWS

on:
  push:
    branches: [dev, prod]

  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run in the dev account
        required: true
        default: plan
        type: choice
        options:
          - credentials-only
          - plan
          - deploy
      scope:
        description: Infrastructure component
        required: true
        default: all
        type: choice
        options:
          - shared
          - tracker
          - worker
          - monitoring
          - all

permissions:
  contents: read

concurrency:
  group: valkyrie-${{ github.ref_name }}-deploy
  cancel-in-progress: false

jobs:
  build-executor-release:
    if: >-
      github.event_name == 'push' ||
      (github.ref == 'refs/heads/dev' && inputs.operation == 'deploy' && inputs.scope == 'all')
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: "services/tracker/uv.lock"

      - name: Install Tracker build dependencies
        working-directory: services/tracker
        run: uv sync --frozen

      - name: Build immutable executor artifact
        working-directory: services/tracker
        run: >-
          uv run python build_executor_artifact.py
          --output-directory "$GITHUB_WORKSPACE/executor-release"
          --source-revision "$GITHUB_SHA"

      - name: Preserve executor artifact for release jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: executor-release-${{ github.sha }}
          path: |
            executor-release/executor.pex
            executor-release/manifest.json
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::613431292675:role/github-actions-valkyrie-deploy
          aws-region: us-east-1
          allowed-account-ids: "613431292675"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install CDK
        run: npm install -g aws-cdk@2.1132.0

      - name: Install infra dependencies
        working-directory: infra
        run: uv sync --frozen --python 3.12

      - name: Deploy all stacks with Slack notifications
        env:
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
          VALKYRIE_ALERTS_SLACK_CHANNEL_ID: ${{ secrets.VALKYRIE_ALERTS_SLACK_CHANNEL_ID }}
          DEPLOYMENT_NOTIFICATIONS_SLACK_CHANNEL_ID: ${{ secrets.DEPLOYMENT_NOTIFICATIONS_SLACK_CHANNEL_ID }}
          AUTH_REQUIRED: ${{ secrets.AUTH_REQUIRED }}
          BENCHMARK_CATALOG_URL: ${{ secrets.BENCHMARK_CATALOG_URL }}
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
        run: |
          cd infra
          uv run cdk deploy --all -c stage=prod --require-approval never

  run-dev-operation:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.DEV_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      DESCOPE_PROJECT_ID: ${{ vars.DESCOPE_PROJECT_ID }}
      DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}
      OPERATION: ${{ github.event_name == 'push' && 'deploy' || inputs.operation }}
      PRODUCTION_ACCOUNT_ID: "613431292675"
      SCOPE: ${{ github.event_name == 'push' && 'all' || inputs.scope }}
      SENTRY_DSN_SECRET_NAME: ${{ vars.SENTRY_DSN_SECRET_NAME }}

    steps:
      - name: Validate dev configuration
        run: |
          set -euo pipefail
          if [[ -z "$DEV_ACCOUNT_ID" || -z "$AWS_DEPLOY_ROLE_ARN" || -z "$AWS_REGION" ]]; then
            echo "::error::The dev Environment must define DEV_ACCOUNT_ID, AWS_DEPLOY_ROLE_ARN, and AWS_REGION."
            exit 1
          fi
          if [[ "$OPERATION" != "credentials-only" && -z "$DESCOPE_PROJECT_ID" ]]; then
            echo "::error::The dev Environment must define DESCOPE_PROJECT_ID before planning or deploying."
            exit 1
          fi
          if [[ ! "$DEV_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::DEV_ACCOUNT_ID must be a 12-digit AWS account ID."
            exit 1
          fi
          if [[ "$DEV_ACCOUNT_ID" == "$PRODUCTION_ACCOUNT_ID" ]]; then
            echo "::error::DEV_ACCOUNT_ID must not be the production AWS account."
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-east-1" ]]; then
            echo "::error::AWS_REGION must be us-east-1; got '$AWS_REGION'."
            exit 1
          fi

      - name: Configure dev AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.DEV_ACCOUNT_ID }}
          role-session-name: valkyrie-dev-${{ github.run_id }}
          unset-current-credentials: true

      - name: Validate dev AWS identity
        run: |
          set -euo pipefail
          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$caller_account" != "$DEV_ACCOUNT_ID" ]]; then
            echo "::error::Expected AWS account '$DEV_ACCOUNT_ID', got '$caller_account'."
            exit 1
          fi

      - name: Checkout code
        if: env.OPERATION != 'credentials-only'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: env.OPERATION != 'credentials-only'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Python
        if: env.OPERATION != 'credentials-only'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        if: env.OPERATION != 'credentials-only'
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install CDK
        if: env.OPERATION != 'credentials-only'
        run: npm install -g aws-cdk@2.1132.0

      - name: Install infra dependencies
        if: env.OPERATION != 'credentials-only'
        working-directory: infra
        run: uv sync --frozen --python 3.12

      - name: Plan dev infrastructure
        if: env.OPERATION == 'plan'
        working-directory: infra
        run: make plan STAGE=dev SCOPE="$SCOPE" DEV_ACCOUNT_ID="$DEV_ACCOUNT_ID" AWS_REGION="$AWS_REGION"

      - name: Deploy dev infrastructure
        if: env.OPERATION == 'deploy'
        working-directory: infra
        run: make deploy STAGE=dev SCOPE="$SCOPE" DEV_ACCOUNT_ID="$DEV_ACCOUNT_ID" AWS_REGION="$AWS_REGION"

  release-development:
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || (inputs.operation == 'deploy' && inputs.scope == 'all'))
    needs: [build-executor-release, run-dev-operation]
    runs-on: ubuntu-24.04-arm
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download immutable executor artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: executor-release-${{ github.sha }}
          path: executor-release

      - name: Configure executor release credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.DEV_ACCOUNT_ID }}:role/ValkyrieExecutorRelease-dev
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.DEV_ACCOUNT_ID }}
          role-session-name: valkyrie-executor-release-${{ github.run_id }}
          unset-current-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install release dependencies
        working-directory: infra
        run: uv sync --frozen

      - name: Publish and activate executor release
        working-directory: infra
        run: >-
          uv run python executor_release.py
          --account-id "$DEV_ACCOUNT_ID"
          --artifact "$GITHUB_WORKSPACE/executor-release/executor.pex"
          --manifest "$GITHUB_WORKSPACE/executor-release/manifest.json"
          --region "$AWS_REGION"
          --stage dev

  release-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: [build-executor-release, deploy-production]
    runs-on: ubuntu-24.04-arm
    environment: production-release
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      PRODUCTION_ACCOUNT_ID: "613431292675"
      PRODUCTION_RELEASE_APPROVAL_CONFIGURED: ${{ vars.PRODUCTION_RELEASE_APPROVAL_CONFIGURED }}

    steps:
      - name: Require configured production approval
        run: |
          if [[ "$PRODUCTION_RELEASE_APPROVAL_CONFIGURED" != "true" ]]; then
            echo "::error::The production-release Environment must require reviewers, restrict prod, and set PRODUCTION_RELEASE_APPROVAL_CONFIGURED=true."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download immutable executor artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: executor-release-${{ github.sha }}
          path: executor-release

      - name: Configure executor release credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::613431292675:role/ValkyrieExecutorRelease
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.PRODUCTION_ACCOUNT_ID }}
          role-session-name: valkyrie-executor-release-${{ github.run_id }}
          unset-current-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install release dependencies
        working-directory: infra
        run: uv sync --frozen

      - name: Publish and activate executor release
        working-directory: infra
        run: >-
          uv run python executor_release.py
          --account-id "$PRODUCTION_ACCOUNT_ID"
          --artifact "$GITHUB_WORKSPACE/executor-release/executor.pex"
          --manifest "$GITHUB_WORKSPACE/executor-release/manifest.json"
          --region "$AWS_REGION"
          --stage prod
