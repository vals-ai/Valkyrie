name: Deploy to AWS

on:
  push:
    branches: [prod]

  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run in the dev account
        required: true
        default: plan
        type: choice
        options:
          - credentials-only
          - plan
          - deploy
      scope:
        description: Infrastructure scope; all contains application stacks only
        required: true
        type: choice
        options:
          - deployment-access
          - dns-zone
          - shared
          - tracker
          - worker
          - monitoring
          - all

permissions:
  contents: read
  id-token: write

concurrency:
  group: valkyrie-${{ github.ref_name }}-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04-arm
    env:
      STAGE: prod
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      CDK_DEFAULT_ACCOUNT: "613431292675"
      CDK_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::613431292675:role/github-actions-valkyrie-deploy
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install infra dependencies
        working-directory: infra
        run: uv sync

      - name: Deploy all stacks with Slack notifications
        working-directory: infra
        env:
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
          VALKYRIE_ALERTS_SLACK_CHANNEL_ID: ${{ secrets.VALKYRIE_ALERTS_SLACK_CHANNEL_ID }}
          DEPLOYMENT_NOTIFICATIONS_SLACK_CHANNEL_ID: ${{ secrets.DEPLOYMENT_NOTIFICATIONS_SLACK_CHANNEL_ID }}
          AUTH_REQUIRED: ${{ secrets.AUTH_REQUIRED }}
          BENCHMARK_CATALOG_URL: ${{ secrets.BENCHMARK_CATALOG_URL }}
          DESCOPE_PROJECT_ID: ${{ secrets.DESCOPE_PROJECT_ID }}
        run: make deploy STAGE=prod SCOPE=all AWS_REGION="$AWS_REGION"

  run-dev-operation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04-arm
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.DEV_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}

    steps:
      - name: Validate dev operation
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "$DEV_ACCOUNT_ID" || -z "$AWS_REGION" || -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "::error::The dev Environment must define DEV_ACCOUNT_ID, AWS_REGION, and AWS_DEPLOY_ROLE_ARN."
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-east-1" ]]; then
            echo "::error::The dev Environment AWS_REGION must be us-east-1, got '$AWS_REGION'."
            exit 1
          fi
          if [[ "${{ inputs.operation }}" == "deploy" && "${{ inputs.scope }}" == "deployment-access" ]]; then
            echo "::error::deployment-access is plan-only in this workflow. Deploy it from the one-time administrator runbook."
            exit 1
          fi

      - name: Configure dev AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.DEV_ACCOUNT_ID }}
          role-session-name: valkyrie-dev-${{ github.run_id }}
          unset-current-credentials: true

      - name: Validate dev AWS target
        run: |
          set -euo pipefail
          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$caller_account" != "$DEV_ACCOUNT_ID" ]]; then
            echo "::error::Expected AWS account '$DEV_ACCOUNT_ID', got '$caller_account'."
            exit 1
          fi
          if [[ "$CDK_DEFAULT_ACCOUNT" != "$DEV_ACCOUNT_ID" ]]; then
            echo "::error::CDK_DEFAULT_ACCOUNT must match DEV_ACCOUNT_ID."
            exit 1
          fi
          if [[ "$AWS_REGION" != "us-east-1" || "$CDK_DEFAULT_REGION" != "us-east-1" ]]; then
            echo "::error::The configured AWS and CDK Regions must be us-east-1."
            exit 1
          fi

      - name: Checkout code
        if: inputs.operation != 'credentials-only'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        if: inputs.operation != 'credentials-only'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        if: inputs.operation != 'credentials-only'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: inputs.operation != 'credentials-only'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install infra dependencies
        if: inputs.operation != 'credentials-only'
        working-directory: infra
        run: make install

      - name: Plan dev infrastructure
        if: inputs.operation == 'plan'
        working-directory: infra
        run: make plan STAGE=dev SCOPE=${{ inputs.scope }} DEV_ACCOUNT_ID="$DEV_ACCOUNT_ID" AWS_REGION="$AWS_REGION"

      - name: Deploy dev infrastructure
        if: inputs.operation == 'deploy'
        working-directory: infra
        run: make deploy STAGE=dev SCOPE=${{ inputs.scope }} DEV_ACCOUNT_ID="$DEV_ACCOUNT_ID" AWS_REGION="$AWS_REGION"
