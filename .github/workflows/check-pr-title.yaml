name: Semantic versioning check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [prod]

permissions: {}

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title for version tag
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ \#(minor|major|patch) ]]; then
            echo "❌ PR title must contain #minor, #major or #patch. Visit https://github.com/vals-ai/Valkyrie/blob/dev/DEVELOPMENT.md#versioning to learn more."
            exit 1
          fi