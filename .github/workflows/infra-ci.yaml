name: Infrastructure checks

on:
  push:
    branches: [dev, prod]
    paths:
      - "infra/**"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/infra-ci.yaml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/infra-ci.yaml"

permissions:
  contents: read

jobs:
  infra-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install infrastructure dependencies
        working-directory: infra
        run: make install

      - name: Run infrastructure lint
        working-directory: infra
        run: make lint

      - name: Run infrastructure tests
        working-directory: infra
        run: make test

      - name: Run infrastructure type check
        working-directory: infra
        run: make typecheck
