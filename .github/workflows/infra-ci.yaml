name: Infrastructure checks

on:
  push:
    branches: [dev, prod]
    paths:
      - "infra/**"
      - "services/tracker/.dockerignore"
      - "services/tracker/Dockerfile.lambda"
      - "services/tracker/pyproject.toml"
      - "services/tracker/uv.lock"
      - "services/tracker/src/tracker/**"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/infra-ci.yaml"
  pull_request:
    paths:
      - "infra/**"
      - "services/tracker/.dockerignore"
      - "services/tracker/Dockerfile.lambda"
      - "services/tracker/pyproject.toml"
      - "services/tracker/uv.lock"
      - "services/tracker/src/tracker/**"
      - ".github/workflows/deploy.yaml"
      - ".github/workflows/infra-ci.yaml"

permissions:
  contents: read

jobs:
  infra-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "infra/uv.lock"

      - name: Install infrastructure dependencies
        working-directory: infra
        run: make install

      - name: Run infrastructure lint
        working-directory: infra
        run: make lint

      - name: Run infrastructure tests
        working-directory: infra
        run: make test

      - name: Run infrastructure type check
        working-directory: infra
        run: make typecheck

      - name: Enable ARM64 container builds
        uses: docker/setup-qemu-action@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the cleanup Lambda image
        working-directory: services/tracker
        run: >-
          docker buildx build
          --platform linux/arm64
          --file Dockerfile.lambda
          --load
          --tag valkyrie-sandbox-cleanup:test
          .

      - name: Import the handler from the cleanup Lambda image
        working-directory: services/tracker
        run: >-
          docker run --rm
          --platform linux/arm64
          --entrypoint /var/lang/bin/python3.12
          valkyrie-sandbox-cleanup:test
          -c "from tracker.sandbox_cleanup import lambda_handler; assert callable(lambda_handler)"
