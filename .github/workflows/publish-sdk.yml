name: Publish Valkyrie SDK

on:
  push:
    branches: [prod]
    paths:
      - "packages/valkyrie-sdk/**"
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        required: true
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: valkyrie-sdk-publish
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      target: ${{ steps.target.outputs.target }}
      environment: ${{ steps.target.outputs.environment }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.26"

      - name: Select and guard package index
        id: target
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            target="pypi"
          else
            target="$REQUESTED_TARGET"
          fi
          if [[ "$target" == "pypi" && "$GITHUB_REF" != "refs/heads/prod" ]]; then
            echo "::error::Production SDK releases must run from refs/heads/prod"
            exit 1
          fi
          if [[ "$target" == "testpypi" && "$GITHUB_REF" != "refs/heads/dev" && "$GITHUB_REF" != "refs/heads/prod" ]]; then
            echo "::error::TestPyPI rehearsals must run from refs/heads/dev or refs/heads/prod"
            exit 1
          fi
          if [[ "$target" == "testpypi" ]]; then
            environment="pypi-test"
          else
            environment="pypi"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

      - name: Install package test tools
        run: uv sync --locked --group dev

      - name: Run release tests
        run: |
          uv run pytest tests/unit/sdk tests/contract -q
          uv run ruff check packages/valkyrie-sdk/src scripts tests/unit/sdk tests/contract
          uv run basedpyright

      - name: Build SDK distributions
        run: uv build --package valkyrie-sdk --no-sources --out-dir release/packages

      - name: Validate SDK distributions
        run: |
          uv run python scripts/sdk/validate_sdk_artifacts.py release/packages/*
          uv run twine check --strict release/packages/*
          uv run check-wheel-contents release/packages/*.whl

      - name: Verify installed distributions and namespace
        run: uv run python scripts/sdk/verify_sdk_install.py --dist release/packages

      - name: Prepare release manifest
        id: release
        run: |
          uv run python scripts/sdk/prepare_sdk_release.py \
            --target "${{ steps.target.outputs.target }}" \
            --dist release/packages \
            --manifest release/SHA256SUMS

      - name: Upload approved release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valkyrie-sdk-${{ steps.release.outputs.version }}
          path: release
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: needs.build.outputs.target != 'pypi' || github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.build.outputs.environment }}
    permissions:
      id-token: write

    steps:
      - name: Download approved release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: valkyrie-sdk-${{ needs.build.outputs.version }}
          path: release

      - name: Verify approved hashes
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Publish to PyPI
        if: needs.build.outputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: release/packages
          attestations: true

      - name: Publish to TestPyPI
        if: needs.build.outputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release/packages
          attestations: true
