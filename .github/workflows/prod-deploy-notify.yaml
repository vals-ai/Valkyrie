name: Prod Deploy Slack Notification

on:
  workflow_run:
    workflows: ["Deploy to AWS", "Auto Tag Release"]
    types: [completed]
    branches: [prod]

permissions:
  contents: write # required by the releases/generate-notes endpoint
  actions: read

jobs:
  notify:
    # Only proceed when the triggering workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check all prod workflows passed
        uses: actions/github-script@v7
        id: check
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const required = ['Deploy to AWS', 'Auto Tag Release'];

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              per_page: 50,
            });

            let deployUrl = '';
            for (const name of required) {
              const run = data.workflow_runs.find(r => r.name === name);
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                console.log(`⏳ ${name}: status=${run?.status ?? 'not found'}, conclusion=${run?.conclusion ?? 'N/A'}`);
                return;
              }
              if (name === 'Deploy to AWS') {
                deployUrl = run.html_url;
              }
            }

            console.log('All required workflows passed');
            core.setOutput('all_passed', 'true');
            core.setOutput('deploy_url', deployUrl);

      - name: Checkout
        if: steps.check.outputs.all_passed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build and send Slack notification
        if: steps.check.outputs.all_passed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          DEPLOY_URL: ${{ steps.check.outputs.deploy_url }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_DEPLOY_WEBHOOK_URL secret not set — skipping notification"
            exit 0
          fi

          CURRENT_TAG=$(git describe --tags --abbrev=0 HEAD)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")

          # Reuse GitHub's auto-generated release notes (identical content to a published release).
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES=$(gh api "repos/${REPO}/releases/generate-notes" \
              -f tag_name="$CURRENT_TAG" -f previous_tag_name="$PREVIOUS_TAG" --jq '.body')
            LABEL="Changes since ${PREVIOUS_TAG}"
          else
            NOTES=$(gh api "repos/${REPO}/releases/generate-notes" \
              -f tag_name="$CURRENT_TAG" --jq '.body')
            LABEL="Release notes"
          fi

          # GitHub markdown -> Slack mrkdwn: "## Heading" -> "*Heading*", "**bold**" -> "*bold*",
          # "* item" -> "• item", "in <pull-url>" -> "(<pull-url|#NN>)" (@ delimiter keeps the mrkdwn pipe).
          NOTES=$(printf '%s\n' "$NOTES" \
            | sed -E 's/^## (.*)$/*\1*/' \
            | sed -E 's/\*\*([^*]+)\*\*/*\1*/g' \
            | sed -E 's/^\* /• /' \
            | sed -E "s@ in (https://github.com/[^ ]+/pull/([0-9]+))@ (<\1|#\2>)@g")

          RELEASE_URL="${SERVER_URL}/${REPO}/releases/tag/${CURRENT_TAG}"

          # Slack section text caps at 3000 chars; trim and point at the full notes.
          if [ "${#NOTES}" -gt 2800 ]; then
            NOTES="${NOTES:0:2800}"$'\n'"…(truncated — see <${RELEASE_URL}|full release notes>)"
          fi

          jq -n \
            --arg tag "$CURRENT_TAG" \
            --arg label "$LABEL" \
            --arg notes "$NOTES" \
            --arg deploy_url "$DEPLOY_URL" \
            --arg release_url "$RELEASE_URL" \
            '{
              text: ("Valkyrie " + $tag + " deployed to prod"),
              blocks: [
                {
                  type: "header",
                  text: { type: "plain_text", text: ("🚀 Valkyrie " + $tag + " deployed to prod"), emoji: true }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("*" + $label + "*\n" + $notes) }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: "🔄 *Update your CLI*\n`uv tool install git+https://github.com/vals-ai/Valkyrie@prod`" }
                },
                {
                  type: "context",
                  elements: [
                    { type: "mrkdwn", text: ("<" + $deploy_url + "|Deploy run> · <" + $release_url + "|Release>") }
                  ]
                }
              ]
            }' > /tmp/slack-payload.json

          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d @/tmp/slack-payload.json \
            "$SLACK_WEBHOOK_URL"
