name: required-context-drift

# Read-only check that the live dev/prod ruleset required contexts match the
# version-controlled manifest (.github/required-contexts.json). Never mutates a ruleset.
# Not a required status check; surfaces drift on a schedule and on demand.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check ruleset drift
        env:
          # Reading a repository ruleset requires administration read access. Provide a
          # least-privileged PAT as RULESET_READ_TOKEN; falls back to the default token.
          GH_TOKEN: ${{ secrets.RULESET_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_required_context_drift.py
