name: Build CLI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: harness-linux
          - os: macos-latest
            artifact: harness-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-local-path: ".setup-uv-cache"
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Build binary
        run: |
          uv run pyinstaller \
            --onefile \
            --name ${{ matrix.artifact }} \
            --distpath dist \
            --clean \
            src/agentic_harness/cli/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
