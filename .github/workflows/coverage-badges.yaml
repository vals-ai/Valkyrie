name: Coverage badges
on:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  cli:
    if: github.repository == 'vals-ai/Valkyrie'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run CLI tests with coverage
        run: make test

      - name: Write coverage badge
        run: python3 scripts/coverage_badge.py coverage.xml "cli coverage" badge-output/cli-coverage.json

      - name: Write docstring coverage badge
        run: uv run docstr-coverage src/valkyrie services/tracker/src/tracker --badge badge-output/docstr-coverage.svg --fail-under 0

      - uses: actions/upload-artifact@v4
        with:
          name: badge-cli
          path: badge-output

  tracker:
    if: github.repository == 'vals-ai/Valkyrie'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/tracker/uv.lock"

      - name: Install tracker dependencies
        working-directory: services/tracker
        run: |
          uv venv --python 3.12
          uv sync --group dev

      - name: Run tracker tests with coverage
        working-directory: services/tracker
        run: make test

      - name: Write coverage badge
        run: python3 scripts/coverage_badge.py services/tracker/coverage.xml "tracker coverage" badge-output/tracker-coverage.json

      - uses: actions/upload-artifact@v4
        with:
          name: badge-tracker
          path: badge-output

  publish:
    needs: [cli, tracker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: badge-*
          path: badge-output
          merge-multiple: true

      - name: Publish badges to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badge-output
          publish_branch: gh-pages
          keep_files: true
