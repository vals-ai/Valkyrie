name: CLI tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  cli-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check generated documentation reference
        run: make docs-reference-check

      - name: Test documentation reference
        run: uv run pytest tests/unit/docs -q

      - name: Run CLI tests with coverage
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: cli

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned so a Mintlify release cannot change the result of a rerun.
      # The CLI is fetched on demand and is not a repository dependency.
      - name: Validate the documentation build
        working-directory: docs
        run: npx --yes mint@4.2.801 validate

      - name: Check for broken links
        working-directory: docs
        run: npx --yes mint@4.2.801 broken-links --check-anchors --check-redirects
