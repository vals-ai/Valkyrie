name: Tracker integration tests
on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  tracker-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Skip automatic runs on PRs
        run: |
          if [ "${{ github.run_attempt }}" = "1" ] && \
             [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.action }}" != "closed" -o "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "Check must be run manually on PRs"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/tracker/uv.lock"

      - name: Install tracker dependencies
        run: |
          cd services/tracker
          uv venv --python 3.12
          uv sync --group dev

      - name: Run integration tests
        run: |
          cd services/tracker
          uv run pytest tests/integration
        env:
          TEST_AWS_S3_BUCKET: ${{ secrets.TEST_AWS_S3_BUCKET }}
          TEST_LOG_GROUP: ${{ secrets.TEST_LOG_GROUP }}
          TEST_DAYTONA_SECRET_NAME: ${{ secrets.TEST_DAYTONA_SECRET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}