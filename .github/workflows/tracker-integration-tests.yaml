name: Tracker live integration tests
on:
  # Runs on every PR so the required check is always reported; the guard skips
  # the (AWS-credentialed) live tests when the PR does not touch the tracker.
  pull_request:
    branches: [dev, prod]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  tracker-live-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: rel
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^services/tracker/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under services/tracker/; skipping live integration tests."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.rel.outputs.relevant == 'true'
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.rel.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/tracker/uv.lock"

      - name: Install tracker dependencies
        if: steps.rel.outputs.relevant == 'true'
        run: |
          cd services/tracker
          uv venv --python 3.12
          uv sync --group dev

      - name: Configure AWS Credentials
        if: steps.rel.outputs.relevant == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::613431292675:role/github-actions-valkyrie-tests
          aws-region: us-east-1

      - name: Run live integration tests
        if: steps.rel.outputs.relevant == 'true'
        run: |
          cd services/tracker
          make test-integration-live
        env:
          TEST_AWS_S3_BUCKET: ${{ secrets.TEST_AWS_S3_BUCKET }}
          TEST_LOG_GROUP: ${{ secrets.TEST_LOG_GROUP }}
          TEST_DAYTONA_SECRET_NAME: ${{ secrets.TEST_DAYTONA_SECRET_NAME }}
          BENCHMARK_SERVICE_BASE_URL: ${{ secrets.BENCHMARK_SERVICE_BASE_URL }}
          BENCHMARK_SERVICE_AUTH_KEY: ${{ secrets.BENCHMARK_SERVICE_AUTH_KEY }}
          AWS_DEFAULT_REGION: us-east-1
