name: Tracker live integration tests
on:
  # Runs on every PR so the required check is always reported. The guard below
  # only assumes the AWS role and runs the live suite in trusted contexts (a
  # prod-targeting PR or a maintainer's manual re-run); otherwise it reports
  # success without minting credentials, preserving the manual-approval gate.
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  tracker-live-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for relevant changes
        id: rel
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ! changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "Could not compute the PR diff; treating as tracker-relevant."
            changed="services/tracker/"
          fi
          if ! printf '%s\n' "$changed" | grep -qE '^services/tracker/'; then
            echo "No changes under services/tracker/; skipping live integration tests."
            echo "relevant=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$BASE_REF" = "prod" ] || [ "${RUN_ATTEMPT:-1}" != "1" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tracker changed, but the live (AWS-credentialed) tests require a manual re-run on non-prod PRs; reporting success without running them."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.rel.outputs.relevant == 'true'
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.rel.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/tracker/uv.lock"

      - name: Install tracker dependencies
        if: steps.rel.outputs.relevant == 'true'
        run: |
          cd services/tracker
          uv venv --python 3.12
          uv sync --group dev

      - name: Validate bench account boundary
        if: steps.rel.outputs.relevant == 'true'
        env:
          BENCH_ACCOUNT_ID: ${{ secrets.VALKYRIE_BENCH_ACCOUNT_ID }}
          TRACKER_INTEGRATION_ROLE_ARN: ${{ secrets.VALKYRIE_TRACKER_INTEGRATION_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ ! "$BENCH_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::VALKYRIE_BENCH_ACCOUNT_ID must be a 12-digit Actions secret."
            exit 1
          fi
          if [[ "$TRACKER_INTEGRATION_ROLE_ARN" != "arn:aws:iam::${BENCH_ACCOUNT_ID}:role/github-actions-valkyrie-tests" ]]; then
            echo "::error::VALKYRIE_TRACKER_INTEGRATION_ROLE_ARN must name the approved Tracker test role in the bench account."
            exit 1
          fi

      - name: Configure AWS Credentials
        if: steps.rel.outputs.relevant == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.VALKYRIE_TRACKER_INTEGRATION_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ secrets.VALKYRIE_BENCH_ACCOUNT_ID }}

      - name: Run live integration tests
        if: steps.rel.outputs.relevant == 'true'
        run: |
          cd services/tracker
          make test-integration-live
        env:
          TEST_AWS_S3_BUCKET: ${{ secrets.TEST_AWS_S3_BUCKET }}
          TEST_LOG_GROUP: ${{ secrets.TEST_LOG_GROUP }}
          TEST_DAYTONA_SECRET_NAME: ${{ secrets.TEST_DAYTONA_SECRET_NAME }}
          BENCHMARK_SERVICE_BASE_URL: ${{ secrets.BENCHMARK_SERVICE_BASE_URL }}
          BENCHMARK_SERVICE_AUTH_KEY: ${{ secrets.BENCHMARK_SERVICE_AUTH_KEY }}
          AWS_DEFAULT_REGION: us-east-1
