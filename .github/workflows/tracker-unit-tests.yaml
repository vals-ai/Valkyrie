name: Tracker tests
on:
  push:
    branches: [dev]
    paths:
      - "services/tracker/**"
  pull_request:
    paths:
      - "services/tracker/**"

jobs:
  tracker-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/tracker/uv.lock"

      - name: Install tracker dependencies
        run: |
          cd services/tracker
          uv venv --python 3.12
          uv sync --group dev

      - name: Run tracker tests with coverage
        run: |
          cd services/tracker
          make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/tracker/coverage.xml
          flags: tracker
