[project]
name = "tracker-shared"
version = "0.1.0"
description = "Shared types, enums, and exceptions used by both the tracker service and the Valkyrie CLI"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker_shared"]
