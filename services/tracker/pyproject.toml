[project]
name = "tracker"
version = "0.1.0"
description = "Tracking service for agentic harness"
authors = [
    { name = "Omar Almatov", email = "52346350+oalmatov@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "boto3>=1.42.20",
    "boto3-stubs[s3]",
    "moto[s3]",
    "fastapi[standard]>=0.135.3",
    "daytona>=0.161.0",
    "sqlmodel>=0.0.38",
    "psycopg2-binary>=2.9.11",
    "httpx>=0.28.1",
    "taskiq>=0.12.1",
    "taskiq-redis>=1.2.2",
    "alembic>=1.18.4",
    "descope>=0.9.0",
    "tenacity>=8.5.0,<9.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-json-logger>=3.2.1",
    "create-benchmark-service @ git+https://github.com/vals-ai/create-benchmark-service.git@main",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff",
    "basedpyright",
    "pytest-env>=1.2.0",
    "pytest-alembic>=0.12.1",
    "testcontainers[postgres]>=4.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.ruff]
line-length = 120
target-version = "py311"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath="."
venv=".venv"
typeCheckingMode = "strict"

reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true

exclude=["src/tracker/database/migrations/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
env = [
    "BROKER_ENVIRONMENT=testing",
]
markers = [
    "slow: marks tests as slow (require Daytona/external services)",
]
