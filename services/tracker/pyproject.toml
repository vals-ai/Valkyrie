[project]
name = "tracker"
version = "0.1.0"
description = "Tracking service for agentic harness"
authors = [
    { name = "Omar Almatov", email = "52346350+oalmatov@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "boto3>=1.42.20",
    "boto3-stubs[s3]",
    "moto[s3]",
    "fastapi[standard]>=0.127.1",
    "daytona>=0.128.1",
    "sqlmodel>=0.0.31",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff",
    "basedpyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath="."
venv=".venv"
typeCheckingMode = "strict"

reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
