networks:
  tracker-network:
    name: tracker-network

services:
  postgres:
    image: postgres:16-alpine
    container_name: tracker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tracker-network

  redis:
    image: redis:7-alpine
    container_name: tracker-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tracker-network

  worker:
    image: tracker-service
    container_name: tracker-worker-container
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "--no-sync", "taskiq", "worker", "tracker.config:broker", "tracker.utils"]
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://tracker:tracker@postgres:5432/tracker
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracker-network

  tracker:
    image: tracker-service
    container_name: tracker-service-container
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "--no-sync", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://tracker:tracker@postgres:5432/tracker
      - DB_HOST=postgres
      - DB_PORT=5432
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - DESCOPE_PROJECT_ID=${DESCOPE_PROJECT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracker-network

volumes:
  postgres_data:
