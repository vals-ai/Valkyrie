[project]
name = "valkyrie-executor-artifact"
version = "0.1.0"
description = "Locked runtime dependencies for immutable executor PEX artifacts"
requires-python = "==3.12.*"
dependencies = [
  "aioboto3>=7.0.0",
  "alembic>=1.18.4",
  "boto3>=1.42.20",
  "boto3-stubs[s3]",
  "create-benchmark-service>=0.11.0",
  "descope>=0.9.0",
  "fastapi[standard]>=0.135.3",
  "httpx>=0.28.1",
  "logfire[fastapi,httpx]>=3.0.0",
  "moto[s3]",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "psycopg2-binary>=2.9.11",
  "python-dotenv>=1.2.2",
  "python-json-logger>=3.2.1",
  "sentry-sdk[fastapi]==2.58.0",
  "sqlmodel>=0.0.38",
  "starlette>=1.0.1",
  "taskiq>=0.12.1",
  "taskiq-redis>=1.2.2",
  "tenacity>=9.0.0",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
create-benchmark-service = { git = "https://github.com/vals-ai/create-benchmark-service.git", rev = "v0.17.3" }
