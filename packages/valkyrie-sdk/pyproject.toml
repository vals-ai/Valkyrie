[project]
name = "valkyrie-sdk"
version = "0.2.4"
description = "Async Python SDK for managing Valkyrie benchmark runs"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2,<3",
  "PyYAML>=6.0.3,<7",
]

[project.urls]
Documentation = "https://github.com/vals-ai/Valkyrie/tree/prod/docs/sdk"
Issues = "https://github.com/vals-ai/Valkyrie/issues"
Repository = "https://github.com/vals-ai/Valkyrie"

[dependency-groups]
test = [
  "basedpyright>=1.31,<2",
  "check-wheel-contents>=0.6,<1",
  "packaging>=24,<26",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
  "twine>=6.2,<7",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valkyrie"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/valkyrie/sdk",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportGeneralTypeIssues = false
enableTypeIgnoreComments = true
