[project]
name = "agentic-harness"
version = "0.1.0"
description = "An agentic harness that interfaces with benchmarks hosted by Vals AI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "pypandoc",
  "model-library",
  "valsai",
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "daytona>=0.123.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "basedpyright",
  "pypdf2"
]


submodules = [
  "ioi-agent",
  "finance-agent",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath=".venv"
typeCheckingMode = "strict"

reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true
reportImplicitRelativeImport = true

include = ["src", "contracts"]

exclude = [
  "submodules/**",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

# Async test configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"


[tool.uv.sources]
ioi-agent = { path = "submodules/ioi_agent" }
finance-agent = { path = "submodules/finance_agent" }
# point these paths to your local repos
model-libary = { path = "../platform/backend/model-library" }
valsai = { path = "../platform/sdk" }
