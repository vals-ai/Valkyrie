[project]
name = "valkyrie"
version = "0.1.0"
description = "Valkyrie - An agentic harness that interfaces with benchmarks hosted by Vals AI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "click>=8.1.0",
  "httpx>=0.28.1",
  "python-dotenv",
  "tracker",
  "aioboto3>=7.0.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
valkyrie = "valkyrie.cli.entry:main"
valk = "valkyrie.cli.entry:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "basedpyright",
  "pyinstaller",
  "pytest-cov>=7.1.0",
  "docstr-coverage>=2.3.2",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath="."
venv=".venv"
typeCheckingMode = "strict"

reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportGeneralTypeIssues = false
reportTypedDictNotRequiredAccess = false
enableTypeIgnoreComments = true

include = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/valkyrie"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

# Async test configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["src/valkyrie"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 1
show_missing = true

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
tracker = { path = "services/tracker", editable = true }
