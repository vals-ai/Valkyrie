[project]
name = "agentic-harness"
version = "0.1.0"
description = "An agentic harness that interfaces with benchmarks hosted by Vals AI"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  "pypandoc",
  "model-library @ git+ssh://git@github.com/vals-ai/model-proxy.git@dev",
  "valsai @ git+ssh://git@github.com/vals-ai/platform-be.git@dev#subdirectory=sdk",
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "basedpyright",
  "pypdf2"
]


# uv pip install ".[ioi]"
ioi = [
  "ioi-agent",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath=".venv"
typeCheckingMode = "strict"

reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true
reportImplicitRelativeImport = true

include = ["src", "contracts"]

exclude = [
  "submodules/**",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

# Async test configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.uv.sources]
ioi-agent = { path = "submodules/ioi_agent" }