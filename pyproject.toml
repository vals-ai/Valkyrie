[project]
name = "agentic-harness"
version = "0.1.0"
description = "An agentic harness that interfaces with benchmarks hosted by Vals AI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "pypandoc",
  "click>=8.1.0",
  "wonderwords>=3.0.1",
  "httpx>=0.28.1",
  "tomli-w",
  "tracker",
  "valsai>=0.1.2",
]

[project.scripts]
harness = "cli.main:cli"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "basedpyright",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["submodules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
venvPath="."
venv=".venv"
typeCheckingMode = "strict"

reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false
enableTypeIgnoreComments = true

include = ["src", "contracts"]

exclude = [
  "**/submodules/**",
  "**/contracts/**",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_harness", "cli", "contracts"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

# Async test configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning"
]


[tool.uv.sources]
tracker = { path = "services/tracker", editable = true }
# ioi-agent = { path = "contracts/ioi/submodules/ioi_agent" }  # Breaks tests
