http_port 3128 name=services ssl-bump generate-host-certificates=off tls-cert=/etc/squid/unused.pem tls-key=/etc/squid/unused.key
http_port 3129 name=dataset-view ssl-bump generate-host-certificates=off tls-cert=/etc/squid/unused.pem tls-key=/etc/squid/unused.key
visible_hostname valsmith-outbound
pid_filename /tmp/squid.pid
pinger_enable off

acl connect method CONNECT
acl credentials urllogin .
acl https port 443
acl service_listener myportname services
acl view_listener myportname dataset-view
acl service_hosts dstdomain -n "/etc/squid/service-hosts.txt"
acl view_hosts dstdomain -n "/etc/squid/view-hosts.txt"
acl approved_hosts any-of service_hosts view_hosts
acl allowed_service all-of service_listener service_hosts
acl allowed_view all-of view_listener view_hosts
acl allowed_destination any-of allowed_service allowed_view
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
http_access deny !connect
http_access allow connect
http_access deny all

# %>ru preserves the original CONNECT authority; ssl::server_name can hide missing SNI.
external_acl_type tls_identity ttl=0 negative_ttl=0 children-max=4 children-startup=2 %>ru %ssl::>sni /usr/bin/python3 /opt/proxy/sni_acl.py
acl matching_identity external tls_identity
acl first_step at_step SslBump1
ssl_bump terminate credentials
ssl_bump terminate !https
ssl_bump terminate !allowed_destination
ssl_bump terminate non_public
ssl_bump peek first_step
ssl_bump splice matching_identity
ssl_bump terminate all
on_unsupported_protocol respond all

cache deny all
cache_mem 0 MB
cache_store_log none
cache_log /dev/null
logfile_rotate 0
logformat approved %ts.%03tu %lp %>rd %Ss/%03>Hs %st %err_code
logformat denied %ts.%03tu %lp - %Ss/%03>Hs %st %err_code
access_log stdio:/dev/stdout approved approved_hosts
access_log stdio:/dev/stdout denied !approved_hosts
request_timeout 30 seconds
connect_timeout 10 seconds
shutdown_lifetime 1 seconds
